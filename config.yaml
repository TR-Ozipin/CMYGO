event_name: "C107"

paths:
  # SQLite 数据库文件路径
  database: "data/database.db"

  # CSV 数据库文件路径 (用于初次迁移，迁移后可删除)
  csv_database: "data/插画师数据库 - 主表.csv"

  # Comike Info CSV 下载目录
  comike_info_dir: "data/comike_info"

  # 品书图片目录
  shinagaki_dir: "data/shinagaki"

  # 输出 HTML 文件的路径
  output_dir: "output"

  # 备份原文件目录 (自动在 shinagaki_dir 下创建，或指定绝对路径)
  backup_subdir_name: "原名备份"
  processed_subdir_name: "已处理"

filters:
  # 想输出的颜色列表，例如 ['color-1', 'color-3']，留空 [] 表示全部颜色
  target_colors: []

# 浏览器配置
browser:
  headless: false       # 首次运行建议 false（需要手动登录）
  channel: "chrome"     # 使用系统 Chrome

# 文件名解析规则
patterns:
  # 提取推特ID的正则: twitter-([^-]+)-\d+-\d+
  twitter_id: "twitter-([^-]+)-\\d+-\\d+"

# Vision LLM 配置 (品书图片识别)
vision:
  enabled: false                        # 是否启用 Vision 识别
  api_base: "http://localhost:1234/v1"  # LM Studio 本地地址
  model: "qwen2.5-vl-7b"               # LM Studio 中加载的模型名
  confidence_threshold: 0.8             # 低于此值标记为手动 review
  # api_key 从环境变量 VISION_API_KEY 读取（LM Studio 可用任意值）

# 捕获入库配置 (Chrome 插件 CMYGO Capture)
ingest:
  dir: "~/Downloads/cmygo"              # Chrome 插件保存的目录
  archive: true                         # 入库后归档原文件到 cmygo/archived/
