event_name: "C107"

paths:
  # 数据库文件路径 (建议放入 data 目录)
  database: "data/插画师数据库 - 主表.csv"
  
  # Comike Info CSV 下载目录
  comike_info_dir: "data/comike_info"
  
  # 品书图片目录
  shinagaki_dir: "data/shinagaki"
  
  # 输出 HTML 文件的路径
  output_dir: "output"
  
  # 备份原文件目录 (自动在 shinagaki_dir 下创建，或指定绝对路径)
  backup_subdir_name: "原名备份"
  processed_subdir_name: "已处理"

filters:
  # 想输出的颜色列表，例如 ['color-1', 'color-3']，留空 [] 表示全部颜色
  target_colors: []

# 文件名解析规则
patterns:
  # 提取推特ID的正则: twitter-([^-]+)-\d+-\d+
  twitter_id: "twitter-([^-]+)-\\d+-\\d+"

